[project]
name = "knowledge-gateway"
version = "0.2.1"
description = "FastAPI service for OpenAI-compatible RAG chat completions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "advanced-alchemy==1.11.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "cryptography>=50.0.1",
    "argon2-cffi>=25.1.0"
]

[dependency-groups]
api = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "markitdown[docx,pdf]>=0.1.7",
    "openai>=3.14.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "scalar-fastapi>=1.9.0",
    "uvicorn[standard]>=0.53.0",
]
migrate = [
    "alembic>=1.20.0",
    "psycopg2-binary>=2.9.13",
]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]

[tool.uv]
default-groups = ["api", "migrate", "dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "TCH", "RUF"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["knowledge_gateway"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
